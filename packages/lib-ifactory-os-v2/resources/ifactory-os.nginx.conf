server {
    listen 80;
    listen [::]:80;

    root {{INSTALL_DIR}}/{{APP_NAME}};
    index index.html;

    server_name localhost 127.0.0.1 192.168.1.100;

    # ---------------------------------------------------------
    # Job-card drawings (runtime ARTIFACT_ROOT) — loopback only
    # ---------------------------------------------------------
    # Files the runtime fetched on behalf of local apps (/rt/files/fetch):
    # today the job-card drawings, laid out as jobs/<jobId>/<fileId>.<ext>.
    # The server listens on every interface, so this location is pinned to
    # loopback: a drawing is customer IP and must not be readable from the
    # plant LAN. `^~` keeps the regex locations below from touching it.
    # Served as-is; the runtime verified sha256 and size on download.
    location ^~ /artifacts/ {
        alias /home/rs/data/artifacts/;
        allow 127.0.0.1;
        allow ::1;
        deny all;
        add_header Cache-Control "no-store";
        add_header X-Content-Type-Options "nosniff";
        autoindex off;
    }

    # ---------------------------------------------------------
    # SvelteKit shell (SPA fallback)
    # ---------------------------------------------------------
    location / {
        try_files $uri /200.html;

        add_header Cache-Control "no-store, no-cache, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # ---------------------------------------------------------
    # Extra no-cache for assets
    # ---------------------------------------------------------
    location ~* \.(html|js|css)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }
}